[workspace]
resolver = "3"
members = ["crates/*"]
# spvval compiles SPIRV-Tools (C++): built on request (-p spvval).
default-members = ["crates/config", "crates/prep", "crates/runtime", "crates/gcn", "crates/sce-elf", "crates/tlgdis", "crates/tlgdbg"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
debug = "line-tables-only"
panic = "abort"
# Development builds: incremental with more codegen units (a one-file change in the runtime
# took ~8.5 min to rebuild otherwise). Distribution builds use `--profile dist`.
incremental = true
codegen-units = 64

# The player package (tools/package.ps1): no debug information, symbols stripped.
[profile.dist]
inherits = "release"
debug = false
strip = true
incremental = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
