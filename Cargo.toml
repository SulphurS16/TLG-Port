[workspace]
resolver = "3"
members = ["crates/*"]
# spvval compiles SPIRV-Tools (C++): built on request (-p spvval).
default-members = ["crates/prep", "crates/runtime", "crates/gcn", "crates/sce-elf", "crates/sotcdis", "crates/sotcdbg"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
