[workspace]
resolver = "3"
members = ["crates/config", "crates/gcn", "crates/launcher", "crates/runtime", "crates/sce-elf"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
debug = "line-tables-only"
panic = "abort"
incremental = true
codegen-units = 64

# The player package (tools/package.ps1): no debug information, symbols stripped.
[profile.dist]
inherits = "release"
debug = false
strip = true
incremental = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
